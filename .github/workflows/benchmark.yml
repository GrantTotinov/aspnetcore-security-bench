name: benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Runtime checks (.NET 8 and 10)
        run: dotnet run --project runner -c Release

      - name: Built-in analyzers
        run: dotnet run --project runner -c Release -- analyze

      - name: Job summary
        if: always()
        run: |
          for f in results/results.md results/analyzers.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
